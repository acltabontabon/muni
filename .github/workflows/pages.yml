name: Publish munimuni.app
# The marketing site (site/) on GitHub Pages, published on pushes to main that touch it. The
# custom domain is set in the repository's Pages settings. Forks and copies skip the job.
on:
  push:
    branches: [main]
    paths: ['site/**', 'scripts/site-stamp.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publish:
    if: github.repository == 'acltabontabon/muni'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      # Every stylesheet and script the page links is stamped with a hash of its contents, so a
      # visitor right after a publish never gets the new page with a cached old stylesheet.
      - run: node scripts/site-stamp.mjs site _site
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with: { path: _site }
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
