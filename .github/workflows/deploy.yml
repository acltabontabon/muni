name: Deploy Muni (production)
# Manual only, and only for the maintainer's repository: forks and copies skip the job. Deploys
# main to the Cloudflare account configured in the `production` environment:
#   secrets   CLOUDFLARE_API_TOKEN (scoped: Workers Scripts, D1, Workers Routes — one account),
#             CLOUDFLARE_ACCOUNT_ID
#   variables MUNI_DOMAIN, MUNI_D1_DATABASE_ID, MUNI_EMAIL_FROM (see worker/scripts/production-config.mjs)
# Pull requests can never reach these: this workflow has no pull_request trigger.
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.repository == 'acltabontabon/muni' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with: { version: 10 }
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts && npm run build
        working-directory: web
      - run: pnpm install --frozen-lockfile && pnpm typecheck && pnpm test
        working-directory: worker
      - name: Render the production config
        working-directory: worker
        env:
          MUNI_DOMAIN: ${{ vars.MUNI_DOMAIN }}
          MUNI_D1_DATABASE_ID: ${{ vars.MUNI_D1_DATABASE_ID }}
          MUNI_EMAIL_FROM: ${{ vars.MUNI_EMAIL_FROM }}
        run: node scripts/production-config.mjs
      # Migrations are additive-only; apply before the new code goes live.
      - run: pnpm migrate:remote && pnpm run deploy
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
